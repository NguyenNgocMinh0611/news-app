<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="520" height="110">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ec8f5"/>
      <stop offset="55%" stop-color="#a8e0f8"/>
      <stop offset="100%" stop-color="#e1f5fe"/>
    </linearGradient>
    <linearGradient id="book1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#ef6c00"/>
    </linearGradient>
    <linearGradient id="book2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>

  <rect width="520" height="110" fill="url(#sky)"/>

  <!-- Clouds -->
  <ellipse cx="44" cy="22" rx="28" ry="12" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="68" cy="19" rx="20" ry="10" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="250" cy="16" rx="26" ry="10" fill="#ffffff" opacity="0.5"/>

  <!-- Open book (left) -->
  <g transform="translate(20,54)">
    <path d="M0 10 Q 20 0 40 10 L40 38 Q 20 28 0 38 Z" fill="url(#book1)"/>
    <path d="M40 10 Q 60 0 80 10 L80 38 Q 60 28 40 38 Z" fill="url(#book2)"/>
    <path d="M40 10 L40 38" stroke="#e65100" stroke-width="1.6" fill="none"/>
    <path d="M8 17 Q 20 11 32 16 M48 17 Q 60 11 72 16" stroke="#fff8e1" stroke-width="1.4" fill="none" opacity="0.8"/>
  </g>

  <!-- Pencil -->
  <g transform="translate(110,26) rotate(16)">
    <rect x="0" y="0" width="6" height="52" rx="1.5" fill="#0288d1"/>
    <rect x="0" y="0" width="6" height="9" fill="#e91e63"/>
    <rect x="0" y="9" width="6" height="3" fill="#ffffff" opacity="0.85"/>
    <path d="M0 52 L6 52 L3 64 Z" fill="#01579b"/>
    <path d="M2 60 L4 60 L3 64 Z" fill="#37474f"/>
  </g>

  <!-- Globe -->
  <g transform="translate(142,40)">
    <circle cx="22" cy="22" r="21" fill="#43a047"/>
    <path d="M1 22 H43 M22 1 V43" stroke="#ffffff" stroke-width="1.4" opacity="0.65" fill="none"/>
    <ellipse cx="22" cy="22" rx="9.5" ry="21" stroke="#ffffff" stroke-width="1.4" opacity="0.65" fill="none"/>
    <ellipse cx="22" cy="22" rx="21" ry="7.5" stroke="#ffffff" stroke-width="1.4" opacity="0.65" fill="none"/>
  </g>

  <!-- Text block -->
  <g transform="translate(190,28)">
    <text x="0" y="15" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#0d47a1" textLength="185" lengthAdjust="spacingAndGlyphs">NHA XUAT BAN GIAO DUC VIET NAM</text>
    <text x="0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#e65100" textLength="185" lengthAdjust="spacingAndGlyphs">LA TRONG TAI THOI DAI CHO NHU NGUOI HOC</text>
    <rect x="0" y="43" width="185" height="3" fill="#ffb300"/>
    <rect x="0" y="49" width="120" height="2" fill="#ffb300" opacity="0.6"/>
  </g>

  <!-- Right illustration: book stack -->
  <g transform="translate(418,20)">
    <rect x="0" y="0" width="40" height="68" rx="3" fill="#ffffff" opacity="0.92"/>
    <rect x="7" y="9" width="26" height="4" rx="1" fill="#0288d1"/>
    <rect x="7" y="18" width="26" height="2.5" rx="1" fill="#90caf9"/>
    <rect x="7" y="25" width="26" height="2.5" rx="1" fill="#90caf9"/>
    <rect x="7" y="32" width="19" height="3" rx="1" fill="#ffb300"/>
    <rect x="7" y="40" width="26" height="17" rx="2" fill="#4fc3f7"/>
    <circle cx="20" cy="48.5" r="5.5" fill="#fff59d"/>
    <rect x="7" y="60" width="21" height="3" rx="1" fill="#b0bec5"/>
  </g>

  <!-- Right illustration: tablet -->
  <g transform="translate(466,30)">
    <rect x="0" y="0" width="36" height="56" rx="3" fill="#ffffff" opacity="0.88"/>
    <rect x="6" y="9" width="24" height="4" rx="1" fill="#c8102e"/>
    <rect x="6" y="18" width="24" height="19" rx="2" fill="#4fc3f7"/>
    <rect x="6" y="42" width="17" height="3" rx="1" fill="#90a4ae"/>
    <rect x="6" y="48" width="11" height="3" rx="1" fill="#b0bec5"/>
  </g>
</svg>
